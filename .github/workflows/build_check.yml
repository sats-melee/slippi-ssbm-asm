name: Build Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:  
  ubuntu64:
    name: "Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Arena PPC test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-powerpc-linux-gnu qemu-user
      - name: Check Arena room menus, credits and result hooks
        env:
          QEMU_GUEST_BASE: "0x100000000"
        run: |
          bash Arena/test-hook.sh
          bash Arena/test-payment-gate.sh
          bash Arena/test-result.sh
          bash Arena/test-room-css.sh
          python3 Arena/validate-room-menu.py
      - name: "Build"
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          sudo docker run --volume=${PWD}:/work --workdir=/work nikhilnarayana/devkitpro-slippi:7 make ini list
      - uses: numtide/clean-git-action@v1
