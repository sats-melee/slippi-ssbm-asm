name: Build Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:  
  ubuntu64:
    name: "Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned assembler and PPC test tools
        run: |
          sudo apt-get update -qq
          bash setup-arena-tools.sh
          echo "$GITHUB_WORKSPACE/build-tools/bin" >> "$GITHUB_PATH"
      - name: Check Arena room menus, credits and result hooks
        env:
          QEMU_GUEST_BASE: "0x100000000"
        run: |
          bash Arena/test-hook.sh
          bash Arena/test-payment-gate.sh
          bash Arena/test-result.sh
          bash Arena/test-room-css.sh
          python3 Arena/validate-room-menu.py
      - name: "Build"
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          make ini list
          expected=$(sha256sum Output/Arena/GALE01r2.ini | cut -d ' ' -f1)
          bash build-arena.sh
          echo "$expected  Output/Arena/GALE01r2.ini" | sha256sum --check
      - uses: numtide/clean-git-action@v1
